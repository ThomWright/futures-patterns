[package]
name = "futures-patterns"
version = "0.1.0"
edition = "2024"

# Let chains, used in composition::fuse's tests, were stabilised for the 2024
# edition in 1.88. Without this field, an older toolchain reports the unstable
# syntax rather than saying the compiler is too old.
rust-version = "1.88"
license = "MIT"
description = "Async patterns built on poll, Pin and Waker, explained"
repository = "https://github.com/ThomWright/futures-patterns"

# Not a crates.io crate; it exists to be read, not depended on.
publish = false

[dependencies]
tokio = { version = "1", features = ["time", "macros", "rt", "rt-multi-thread", "sync"] }
pin-project-lite = "0.2"

[dev-dependencies]
# test-util provides a paused clock, so the timeout tests are deterministic and
# instant instead of sleeping in real time.
tokio = { version = "1", features = [
    "time",
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "test-util",
] }
